<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Open Rebellion — Star Wars Rebellion</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: #050510; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #main-menu-semantics button {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <nav id="main-menu-semantics" aria-label="Open Rebellion main menu" hidden>
        <button type="button" data-menu-index="0">Easy difficulty, X-wing</button>
        <button type="button" data-menu-index="1">Intermediate difficulty, Star Destroyer</button>
        <button type="button" data-menu-index="2">Expert difficulty, Death Star</button>
        <button type="button" data-menu-index="3">Cycle galaxy size</button>
        <button type="button" data-menu-index="4">Small galaxy</button>
        <button type="button" data-menu-index="5">Medium galaxy</button>
        <button type="button" data-menu-index="6">Large galaxy</button>
        <button type="button" data-menu-index="7">Toggle Standard or Headquarters Only game</button>
        <button type="button" data-menu-index="8">Start as the Galactic Empire</button>
        <button type="button" data-menu-index="9">Start as the Rebel Alliance</button>
        <button type="button" data-menu-index="10">Load game and options</button>
        <button type="button" data-menu-index="11">Credits</button>
        <button type="button" data-menu-index="12">Multiplayer</button>
        <button type="button" data-menu-index="13">Quit</button>
        <button type="button" data-menu-index="14">Menu music</button>
        <button type="button" data-menu-index="15" aria-haspopup="dialog">Fleet registry</button>
    </nav>
    <!-- macroquad/miniquad JS glue — provides load() and WebGL bindings -->
    <script src="gl.js"></script>
    <script>
        (function registerMainMenuAccessibility() {
            "use strict";

            const root = document.getElementById("main-menu-semantics");
            const canvas = document.getElementById("glcanvas");
            const buttons = Array.from(root.querySelectorAll("button[data-menu-index]"));
            let active = false;

            function callExport(name, value) {
                if (wasm_exports && typeof wasm_exports[name] === "function") {
                    wasm_exports[name](value);
                }
            }

            function focusButton(index) {
                const wrapped = (index + buttons.length) % buttons.length;
                buttons[wrapped].focus({ preventScroll: true });
            }

            function register(imports) {
                imports.env.open_rebellion_quit = function () {
                    document.querySelectorAll("canvas").forEach((canvas) => { canvas.hidden = true; });
                    const screen = document.createElement("section");
                    screen.setAttribute("aria-label", "Game closed");
                    screen.style.cssText = "position:fixed;inset:0;display:grid;place-content:center;gap:1rem;background:#080b12;color:#eee;text-align:center;font:20px sans-serif";
                    const title = document.createElement("h1");
                    title.textContent = "Game closed";
                    const restart = document.createElement("button");
                    restart.textContent = "Restart game";
                    restart.onclick = () => window.location.reload();
                    screen.append(title, restart);
                    document.body.append(screen);
                    restart.focus();
                };
                imports.env.open_rebellion_a11y_sync = function (
                    isActive,
                    focused,
                    difficulty,
                    galaxySize,
                    headquartersOnly,
                    musicEnabled,
                ) {
                    const nextActive = Boolean(isActive);
                    const ownedFocus = buttons.includes(document.activeElement);
                    active = nextActive;
                    root.hidden = !active;
                    root.dataset.active = String(active);
                    buttons.forEach((button, index) => {
                        button.tabIndex = active ? 0 : -1;
                        button.dataset.focused = String(index === focused);
                    });

                    for (const index of [0, 1, 2]) {
                        buttons[index].setAttribute("aria-pressed", String(index === difficulty));
                    }
                    for (const index of [4, 5, 6]) {
                        buttons[index].setAttribute("aria-pressed", String(index === galaxySize));
                    }
                    buttons[7].setAttribute("aria-pressed", String(Boolean(headquartersOnly)));
                    buttons[14].setAttribute("aria-pressed", String(Boolean(musicEnabled)));

                    const galaxyLabel = buttons[galaxySize].textContent;
                    buttons[3].setAttribute(
                        "aria-label",
                        `Cycle galaxy size, current ${galaxyLabel}`,
                    );
                    buttons[7].setAttribute(
                        "aria-label",
                        `Toggle game type, current ${
                            headquartersOnly ? "Headquarters Only" : "Standard Game"
                        }`,
                    );

                    if (!active && ownedFocus) {
                        canvas.focus({ preventScroll: true });
                    }
                };
            }

            function onInit() {
                buttons.forEach((button, index) => {
                    button.addEventListener("focus", () => {
                        if (active) {
                            callExport("open_rebellion_menu_focus", index);
                        }
                    });
                    button.addEventListener("blur", () => {
                        if (active) {
                            callExport("open_rebellion_menu_focus", -1);
                        }
                    });
                    button.addEventListener("click", event => {
                        event.preventDefault();
                        if (active) {
                            callExport("open_rebellion_menu_activate", index);
                        }
                    });
                    button.addEventListener("keydown", event => {
                        let offset = 0;
                        if (event.key === "Tab") {
                            offset = event.shiftKey ? -1 : 1;
                        } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
                            offset = -1;
                        } else if (event.key === "ArrowRight" || event.key === "ArrowDown") {
                            offset = 1;
                        }
                        if (offset !== 0) {
                            event.preventDefault();
                            event.stopPropagation();
                            focusButton(index + offset);
                        }
                    });
                });

                // Miniquad consumes Tab on its canvas. Move it into the
                // semantic control order first and suppress the duplicate
                // canvas traversal.
                canvas.addEventListener("keydown", event => {
                    if (active && event.key === "Tab") {
                        event.preventDefault();
                        event.stopImmediatePropagation();
                        focusButton(event.shiftKey ? buttons.length - 1 : 0);
                    }
                }, true);
            }

            miniquad_add_plugin({
                register_plugin: register,
                on_init: onInit,
                version: 1,
                name: "open_rebellion_a11y",
            });
        }());
    </script>
    <script>
        (function registerReplayEquivalenceGate() {
            "use strict";

            const params = new URLSearchParams(window.location.search);
            const values = params.getAll("replay-check");
            const mode = values.length === 0
                ? 0
                : values.length === 1 && values[0] === "seed42-v1"
                    ? 1
                    : 2;

            function register(imports) {
                imports.env.open_rebellion_replay_mode = function () {
                    return mode;
                };
                imports.env.open_rebellion_replay_emit = function (ptr, len) {
                    try {
                        const bytes = new Uint8Array(wasm_memory.buffer, ptr, len);
                        const text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
                        window.__openRebellionReplay = JSON.parse(text);
                    } catch (error) {
                        window.__openRebellionReplay = {
                            schema_version: 1,
                            fixture_id: "seed42-v1",
                            platform: "javascript-bridge",
                            status: "failed",
                            failure_phase: "bridge",
                            error: String(error),
                        };
                    }
                    window.dispatchEvent(new CustomEvent(
                        "open-rebellion-replay-complete",
                        { detail: window.__openRebellionReplay },
                    ));
                };
            }

            miniquad_add_plugin({
                register_plugin: register,
                version: 1,
                name: "open_rebellion_replay",
            });
        }());
    </script>
    <script>
        (function registerFocusLossCounter() {
            "use strict";

            // Miniquad does not pass focus loss to macroquad's input
            // subscribers. Count it here so a pointer capture whose release
            // never arrives can be cancelled on the next frame.
            let losses = 0;
            function lose() {
                losses = (losses + 1) >>> 0;
            }
            window.addEventListener("blur", lose);
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "hidden") {
                    lose();
                }
            });

            function register(imports) {
                imports.env.open_rebellion_focus_losses = function () {
                    return losses;
                };
            }

            miniquad_add_plugin({
                register_plugin: register,
                version: 1,
                name: "open_rebellion_focus",
            });
        }());
    </script>
    <script>load("open-rebellion.wasm");</script>
</body>
</html>
