[package]
name = "rebellion-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Fixture-only constructors used by rebellion-render's interface-test-fixtures.
interface-test-fixtures = []
# Shared world fixtures and battle fixtures (`tactical::test_support`) for
# downstream crate tests.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
slotmap = { workspace = true }

[dev-dependencies]
strum = { version = "0.26", features = ["derive"] }

[lints]
workspace = true
