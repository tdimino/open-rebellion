[package]
name = "rebellion-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "open-rebellion"
path = "src/main.rs"

[features]
default = []
# Compiled only into the isolated browser-acceptance artifact. Production
# packaging rejects this feature and its JavaScript bridge exports.
interface-test-fixtures = []

[dependencies]
rebellion-core = { path = "../rebellion-core" }
rebellion-data = { path = "../rebellion-data" }
rebellion-render = { path = "../rebellion-render" }
macroquad = "0.4"
egui-macroquad = "0.17"
quad-snd = "0.2"
rand = "0.8"
rand_xoshiro = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
