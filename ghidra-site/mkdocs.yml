site_name: "Open Rebellion — Ghidra RE"
site_description: "Reverse engineering of Star Wars Rebellion (1998, LucasArts)—decompiled REBEXE functions, the battle and bombardment paths, AI behavior, the C++ class hierarchy."
site_url: "https://tdimino.github.io/open-rebellion/"
repo_url: "https://github.com/tdimino/open-rebellion"
repo_name: "tdimino/open-rebellion"

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/rebellion-starbird.png
  logo: assets/rebellion-starbird.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - meta
  - social:
      cards_layout_options:
        background_color: "#0d0d0d"
        color: "#ffc107"
        font_family: Roboto

nav:
  - Home: index.md
  - AI Functions: ai-functions.md
  - Scholar Documents:
    - Annotated Functions: scholar/annotated-functions.md
    - C++ Class Hierarchy: scholar/cpp-class-hierarchy.md
    - Entity System: scholar/entity-system.md
    - Economy Systems: scholar/economy-systems.md
    - Mission & Event Cookbook: scholar/mission-event-cookbook.md
    - Modders Taxonomy: scholar/modders-taxonomy.md
    - Rust Implementation Guide: scholar/rust-implementation-guide.md
    - AI Behavior Analysis: scholar/ai-behavior-analysis.md
    - COMMON.DLL Analysis: scholar/common-dll-analysis.md
  - Combat:
    - Story-Check Chain: combat/space-combat.md
    - Character Move Hook: combat/ground-combat.md
    - Orbital Bombardment: combat/bombardment.md
    - Binary Overview: combat/combat-formulas.md
    - Where Combat Is Resolved: combat/COMBAT-SUMMARY.md
  - Setup & Workflow: setup.md
  - Expansions:
    - Homeworld Expansion: expansions/homeworld.md
    - Total Conversions & Eras: expansions/total-conversions.md
  - Indexes:
    - Function Index (5,151): indexes/function-index.md
    - Notes Index: indexes/notes-index.md
  - Game Guide:
    - The Galactic Civil War: guide/scenario.md
    - Factions: guide/factions.md
    - Characters & Officers: guide/characters.md
    - The Galaxy: guide/galactic-map.md
    - Building Your War Machine: guide/economy.md
    - Research & Tech Trees: guide/tech-trees.md
    - Fleets & Combat: guide/fleets-and-combat.md
    - Missions: guide/missions.md
    - Victory & Defeat: guide/winning.md
